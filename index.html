<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FFA Clone Battle Royale</title> 
    
    <style>
        body {
            margin: 0;
            overflow: hidden; 
            background-color: #000;
        }

        canvas {
            display: block;
        }
        
        /* Lobby Screen Styles */
        #lobby-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Arial', sans-serif;
            z-index: 100;
        }

        #lobby-screen h1 {
            font-size: 5em;
            margin-bottom: 5px;
            color: #ffde00;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
        }

        #lobby-screen p {
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        #play-button {
            padding: 15px 60px;
            font-size: 1.8em;
            cursor: pointer;
            background-color: #00bfff;
            border: 3px solid #ffffff;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        #play-button:hover {
            background-color: #0099e6;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
        }

        /* Crosshair Style */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            pointer-events: none; 
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            display: none; 
        }

        /* --- UI Overlays --- */
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            color: white;
            font-family: sans-serif;
            padding: 10px;
            display: none; 
        }

        #health-bar, #zone-info {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        /* Inventory Positioning (Bottom Right and Smaller) */
        #inventory {
            position: fixed;
            bottom: 20px;
            right: 20px; 
            left: auto;  
            transform: none; 
            display: flex;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 5px; 
            border-radius: 8px;
        }

        #inventory h3 {
            display: none;
        }

        /* Slot Sizes (Smaller) */
        .slot {
            width: 60px; 
            height: 60px; 
            line-height: 60px;
            text-align: center;
            margin: 0 4px; 
            border: 2px solid #666; 
            background-color: #333;
            border-radius: 4px;
            transition: border-color 0.2s;
            font-size: 12px; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .slot.active {
            border-color: #ff9900; 
            background-color: #555;
        }
    </style>
</head>
<body>
    <div id="lobby-screen">
        <h1>FFA Clone Battle Royale</h1>
        <p>A simple Third-Person Shooter by AhmadsBewerbung.</p>
        <button id="play-button">Start Battle</button>
    </div>

    <div id="crosshair"></div>

    <div id="game-ui">
        <div id="health-bar">Health: <span id="health-value">100</span></div>
        <div id="zone-info">Zone Size: <span id="zone-size">100</span></div>
        
        <div id="inventory">
            <h3>Inventory (Keys 1-5)</h3>
            <div class="slot" data-key="1">1. Empty</div>
            <div class="slot" data-key="2">2. Empty</div>
            <div class="slot" data-key="3">3. Empty</div>
            <div class="slot" data-key="4">4. Empty</div>
            <div class="slot" data-key="5">5. Empty</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Global Game Variables ---
        let scene, camera, renderer;
        let playerHealth = 100;
        let zoneRadius = 100; 
        let zoneCenter = new THREE.Vector3(0, 0, 0); 
        const damagePerTick = 1;
        const zoneShrinkRate = 0.05; 
        const clock = new THREE.Clock();

        // --- Inventory Data ---
        const inventory = [
            { name: "AR (Epic)", rarity: "Epic" },
            { name: "Pistol (Common)", rarity: "Common" },
            { name: "Sniper (Legendary)", rarity: "Legendary" },
            { name: "Shotgun (Rare)", rarity: "Rare" },
            { name: "SMG (Uncommon)", rarity: "Uncommon" }
        ];
        let activeSlot = 0; 

        // --- Player & Camera Variables ---
        const playerSpeed = 0.3;
        const keyState = {};
        const player = new THREE.Object3D(); 
        const cameraPitch = new THREE.Object3D(); 
        player.position.set(0, 1.7, 10); 

        // Physics Variables
        let velocityY = 0; 
        const gravity = -9.8 * 0.02; 
        const jumpPower = 0.6; 
        const groundY = 0; 
        
        // Third Person Camera Constants - Left-Side View
        const TP_CAMERA_DISTANCE = 6;
        const TP_CAMERA_HEIGHT = 4;
        const TP_CAMERA_LATERAL = -2.5; 
        
        // Shooting Variables
        const bulletSpeed = 2.5;
        const activeBullets = [];
        let gameActive = false; 

        // --- Initialization Function ---
        function init() {
            document.getElementById('play-button').addEventListener('click', startGame);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            // Attach input handlers to the document, or sometimes the renderer element is better for mouse.
            document.addEventListener('keydown', onKeyDown, false);
            document.addEventListener('keyup', onKeyUp, false);
            document.addEventListener('click', onDocumentClick, false);

            // CRITICAL FIX: Attach mouse move specifically to the canvas/renderer element 
            // after it's in the DOM, so Pointer Lock works reliably with camera controls.
            renderer.domElement.addEventListener('mousemove', onMouseMove, false);
            
            animate();
        }
        
        // --- Game State and Start Logic ---
        function startGame() {
            if (scene) return; 
            
            // Hide Lobby UI
            document.getElementById('lobby-screen').style.display = 'none';
            // Show Game UI
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';

            // --- 3D Scene Setup ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x5ad4e4);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(TP_CAMERA_LATERAL, TP_CAMERA_HEIGHT, TP_CAMERA_DISTANCE);
            
            cameraPitch.add(camera);
            player.add(cameraPitch);
            scene.add(player);

            createHumanoidPlayer(player);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 3);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(300, 300);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2; 
            scene.add(ground);

            // Map Features
            createMapFeature(new THREE.Vector3(20, 5, 20), new THREE.Vector3(10, 10, 10), 0x964b00); 
            createMapFeature(new THREE.Vector3(-30, 7.5, 10), new THREE.Vector3(15, 15, 15), 0x808080); 
            createMapFeature(new THREE.Vector3(5, 2.5, -40), new THREE.Vector3(5, 5, 5), 0x006400); 

            // Request Pointer Lock here to capture input
            renderer.domElement.requestPointerLock();
            gameActive = true;
            onWindowResize(); 
        }

        // --- Helper for handling initial click and shooting ---
        function onDocumentClick(event) {
            // If the game is active, this click triggers the shoot function
            if (gameActive && document.pointerLockElement) {
                shoot();
            } 
            // If the game is active but pointer lock was lost (e.g., pressed ESC), 
            // a click should re-lock the pointer
            else if (gameActive && !document.pointerLockElement) {
                renderer.domElement.requestPointerLock();
            }
        }

        // --- Humanoid Player Builder ---
        function createHumanoidPlayer(playerContainer) {
            // Torso (Body)
            const bodyGeometry = new THREE.BoxGeometry(1, 1.2, 0.6);
            const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 }); 
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1.4;
            playerContainer.add(body);
            
            // Head
            const headGeometry = new THREE.SphereGeometry(0.5, 16, 16);
            const headMaterial = new THREE.MeshLambertMaterial({ color: 0xffdbac }); 
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 2.4;
            playerContainer.add(head);

            // Legs (combined block for simplicity)
            const legGeometry = new THREE.BoxGeometry(0.8, 1.4, 0.6);
            const legMaterial = new THREE.MeshLambertMaterial({ color: 0x00008b }); 
            const legs = new THREE.Mesh(legGeometry, legMaterial);
            legs.position.y = 0.7;
            playerContainer.add(legs);
        }

        // --- Main Game Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            if (gameActive && scene && renderer) {
                const delta = clock.getDelta();
                handlePhysics(delta); 
                handlePlayerMovement(delta);
                handleZoneLogic();
                handleBullets(delta); 
                
                // Camera fix: Ensure camera looks forward/down correctly from its offset position
                camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
                
                renderer.render(scene, camera);
            }
        }

        // --- Physics Handler (Gravity and Jump) ---
        function handlePhysics(delta) {
            // This entire block only runs if gameActive is true (checked in animate())
            
            // 1. Apply Gravity
            velocityY += gravity;
            
            // 2. Apply Vertical Movement
            player.position.y += velocityY * delta * 60; 

            // 3. Ground Check
            if (player.position.y <= groundY) {
                player.position.y = groundY; 
                velocityY = 0; 
                
                // Handle jump initiation when on the ground
                if (keyState[' ']) { 
                    velocityY = jumpPower; 
                    keyState[' '] = false; // Consume the jump press
                }
            }
        }


        // --- Shooting Logic ---
        function shoot() {
            // Check Pointer Lock status before shooting (CRITICAL)
            if (!gameActive || !document.pointerLockElement) return;

            const shootRaycaster = new THREE.Raycaster();
            shootRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera); 
            const direction = shootRaycaster.ray.direction.clone();
            
            const bulletGeometry = new THREE.SphereGeometry(0.15, 8, 8);
            const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
            
            const spawnHeight = player.position.y + 1.2; 
            bullet.position.copy(player.position).add(direction.clone().multiplyScalar(1));
            bullet.position.y = spawnHeight;

            scene.add(bullet);

            activeBullets.push({
                mesh: bullet,
                direction: direction.normalize(), 
                life: 300 
            });
        }

        function handleBullets(delta) {
            for (let i = activeBullets.length - 1; i >= 0; i--) {
                const bulletData = activeBullets[i];
                
                bulletData.mesh.position.addScaledVector(bulletData.direction, bulletSpeed * delta * 60);
                
                bulletData.life--;

                if (bulletData.life <= 0) {
                    scene.remove(bulletData.mesh);
                    activeBullets.splice(i, 1);
                }
            }
        }


        // --- Game Logic Functions ---
        function handlePlayerMovement(delta) {
            // This entire block only runs if gameActive is true (checked in animate())
            // Check Pointer Lock status for movement (CRITICAL)
            if (!document.pointerLockElement) return;

            const distance = playerSpeed * delta * 60; 

            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyQuaternion(player.quaternion);
            forward.y = 0; 
            forward.normalize();
            
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            // W - Move Forward
            if (keyState['w']) {
                player.position.addScaledVector(forward, distance);
            }
            // S - Move Backward
            if (keyState['s']) {
                player.position.addScaledVector(forward, -distance);
            }
            // A - Strafe Left
            if (keyState['a']) {
                player.position.addScaledVector(right, -distance);
            }
            // D - Strafe Right
            if (keyState['d']) {
                player.position.addScaledVector(right, distance);
            }
            
            const maxBound = 145; 
            player.position.x = Math.max(-maxBound, Math.min(maxBound, player.position.x));
            player.position.z = Math.max(-maxBound, Math.min(maxBound, player.position.z));
        }

        function handleZoneLogic() {
            if (!gameActive) return;
            zoneRadius -= zoneShrinkRate * clock.getDelta();
            zoneRadius = Math.max(10, zoneRadius); 

            const playerDistance = player.position.distanceTo(zoneCenter);
            
            if (playerDistance > zoneRadius) {
                playerHealth = Math.max(0, playerHealth - damagePerTick * clock.getDelta() * 10);
                updateHealthUI();

                renderer.domElement.style.border = '2px solid red';
                setTimeout(() => renderer.domElement.style.border = 'none', 100);
            }

            updateZoneUI();

            if (playerHealth <= 0) {
                alert("You were eliminated by the storm! Refresh to restart.");
                cancelAnimationFrame(animate); 
            }
        }


        // --- UI Update Functions and Helpers ---
        function updateInventoryUI() {
            const slots = document.querySelectorAll('.slot');
            slots.forEach((slot, index) => {
                const item = inventory[index];
                slot.textContent = `${index + 1}. ${item.name}`;
                slot.style.color = getRarityColor(item.rarity);
                
                if (index === activeSlot) {
                    slot.classList.add('active');
                } else {
                    slot.classList.remove('active');
                }
            });
        }

        function updateHealthUI() {
            document.getElementById('health-value').textContent = Math.round(playerHealth);
        }

        function updateZoneUI() {
            document.getElementById('zone-size').textContent = Math.round(zoneRadius);
        }

        function getRarityColor(rarity) {
            switch(rarity) {
                case 'Common': return '#aaaaaa'; 
                case 'Uncommon': return '#00aa00'; 
                case 'Rare': return '#0000aa'; 
                case 'Epic': return '#aa00aa'; 
                case 'Legendary': return '#ff8000'; 
                default: return 'white';
            }
        }

        function createMapFeature(position, size, color) {
            const geometry = new THREE.BoxGeometry(size.x, size.y, size.z);
            const material = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(position.x, position.y / 2, position.z); 
            scene.add(mesh);
        }
        
        function onWindowResize() {
            if (camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        function onKeyDown(event) {
            if (!gameActive) return;
            const key = event.key.toLowerCase();
            keyState[key] = true; 
            
            if (key === ' ') {
                keyState[' '] = true;
            }

            const slotKey = parseInt(event.key);
            if (slotKey >= 1 && slotKey <= 5) {
                activeSlot = slotKey - 1;
                updateInventoryUI();
            }
        }

        function onKeyUp(event) {
            if (!gameActive) return;
            keyState[event.key.toLowerCase()] = false;
        }

        // Mouse movement handler is now attached to renderer.domElement
        function onMouseMove(event) {
            // CRITICAL FIX: Ensure pointer is locked
            if (!gameActive || document.pointerLockElement !== renderer.domElement) return;

            const movementX = event.movementX || 0;
            const movementY = event.movementY || 0;

            // Yaw (Left/Right)
            player.rotation.y -= movementX * 0.002;
            
            // Pitch (Up/Down)
            cameraPitch.rotation.x -= movementY * 0.002;
            
            const maxPitch = Math.PI / 4; 
            cameraPitch.rotation.x = Math.max(-maxPitch, Math.min(maxPitch, cameraPitch.rotation.x));
        }

        window.onload = init;
    </script>
</body>
</html>
