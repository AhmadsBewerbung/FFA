<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FFA Battle Royale Game</title> 
    
    <style>
        body {
            margin: 0;
            overflow: hidden; 
            background-color: #000;
        }

        canvas {
            display: block;
        }
        
        /* New Lobby Screen Styles */
        #lobby-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            z-index: 100; /* Ensure it's on top */
        }

        #lobby-screen h1 {
            font-size: 4em;
            margin-bottom: 20px;
            color: #ff9900;
        }

        #play-button {
            padding: 15px 40px;
            font-size: 1.5em;
            cursor: pointer;
            background-color: #00aa00;
            border: none;
            border-radius: 8px;
            color: white;
            transition: background-color 0.2s;
        }

        #play-button:hover {
            background-color: #008800;
        }

        /* Crosshair Style */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            pointer-events: none; 
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            display: none; /* Hidden until game starts */
        }

        /* --- UI Overlays --- */
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            color: white;
            font-family: sans-serif;
            padding: 10px;
            display: none; /* Hidden until game starts */
        }

        #health-bar, #zone-info {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        /* Inventory Positioning (Bottom Right and Smaller) */
        #inventory {
            position: fixed;
            bottom: 20px;
            right: 20px; 
            left: auto;  
            transform: none; 
            display: flex;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 5px; 
            border-radius: 8px;
        }

        #inventory h3 {
            display: none;
        }

        /* Slot Sizes (Smaller) */
        .slot {
            width: 60px; 
            height: 60px; 
            line-height: 60px;
            text-align: center;
            margin: 0 4px; 
            border: 2px solid #666; 
            background-color: #333;
            border-radius: 4px;
            transition: border-color 0.2s;
            font-size: 12px; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .slot.active {
            border-color: #ff9900; 
            background-color: #555;
        }
    </style>
</head>
<body>
    <div id="lobby-screen">
        <h1>FFA Clone Battle Royale</h1>
        <p>A simple Third-Person Shooter by AhmadsBewerbung.</p>
        <button id="play-button">Start Game</button>
    </div>

    <div id="crosshair"></div>

    <div id="game-ui">
        <div id="health-bar">Health: <span id="health-value">100</span></div>
        <div id="zone-info">Zone Size: <span id="zone-size">100</span></div>
        
        <div id="inventory">
            <h3>Inventory (Keys 1-5)</h3>
            <div class="slot" data-key="1">1. Empty</div>
            <div class="slot" data-key="2">2. Empty</div>
            <div class="slot" data-key="3">3. Empty</div>
            <div class="slot" data-key="4">4. Empty</div>
            <div class="slot" data-key="5">5. Empty</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Global Game Variables ---
        let scene, camera, renderer;
        let playerHealth = 100;
        let zoneRadius = 100; 
        let zoneCenter = new THREE.Vector3(0, 0, 0); 
        const damagePerTick = 1;
        const zoneShrinkRate = 0.05; 
        const clock = new THREE.Clock();

        // --- Inventory Data ---
        const inventory = [
            { name: "AR (Epic)", rarity: "Epic" },
            { name: "Pistol (Common)", rarity: "Common" },
            { name: "Sniper (Legendary)", rarity: "Legendary" },
            { name: "Shotgun (Rare)", rarity: "Rare" },
            { name: "SMG (Uncommon)", rarity: "Uncommon" }
        ];
        let activeSlot = 0; 

        // --- Player & Camera Variables ---
        const playerSpeed = 0.3;
        const keyState = {};
        const player = new THREE.Object3D(); 
        const cameraPitch = new THREE.Object3D(); // NEW: Object to handle up/down look
        player.position.set(0, 0, 10); 

        // Third Person Camera Constants - Left-Side View
        const TP_CAMERA_DISTANCE = 6;
        const TP_CAMERA_HEIGHT = 4;
        const TP_CAMERA_LATERAL = -2.5; 
        
        // --- Shooting Variables ---
        const bulletSpeed = 2.5;
        const activeBullets = [];
        let gameActive = false; // NEW: State variable

        // --- Initialization Function ---
        function init() {
            // 1. Scene and Renderer Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(TP_CAMERA_LATERAL, TP_CAMERA_HEIGHT, TP_CAMERA_DISTANCE);
            
            // NEW: Camera is attached to the pitch object, which is attached to the player
            cameraPitch.add(camera);
            player.add(cameraPitch);
            scene.add(player);

            // Player body mesh
            const playerBodyGeometry = new THREE.CylinderGeometry(0.5, 0.5, 1.7, 16);
            const playerBodyMaterial = new THREE.MeshLambertMaterial({ color: 0x00aa00 }); 
            const playerBody = new THREE.Mesh(playerBodyGeometry, playerBodyMaterial);
            playerBody.position.y = 0.85; 
            player.add(playerBody); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 2. Lighting and Map Setup (same as before)
            const ambientLight = new THREE.AmbientLight(0x606060);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 1, 0.5).normalize();
            scene.add(directionalLight);

            const groundGeometry = new THREE.PlaneGeometry(300, 300);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x228b22 }); 
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2; 
            scene.add(ground);

            createMapFeature(new THREE.Vector3(20, 5, 20), new THREE.Vector3(10, 10, 10), 0x964b00); 
            createMapFeature(new THREE.Vector3(-30, 7.5, 10), new THREE.Vector3(15, 15, 15), 0x808080); 
            createMapFeature(new THREE.Vector3(5, 2.5, -40), new THREE.Vector3(5, 5, 5), 0x006400); 

            // 3. UI and Event Listeners
            updateInventoryUI();
            updateHealthUI();
            updateZoneUI();
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('keydown', onKeyDown, false);
            document.addEventListener('keyup', onKeyUp, false);
            document.addEventListener('mousemove', onMouseMove, false);

            document.getElementById('play-button').addEventListener('click', startGame);

            // Start loop immediately, but logic only runs when gameActive is true
            animate();
        }
        
        // --- NEW: Game State and Start Logic ---
        function startGame() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            renderer.domElement.requestPointerLock();
            gameActive = true;
        }


        // --- Main Game Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (gameActive) {
                handlePlayerMovement(delta);
                handleZoneLogic();
                handleBullets(delta); 
                
                // Camera always looks at the player's chest height
                camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
            }
            
            renderer.render(scene, camera);
        }

        // --- Shooting Logic ---
        function shoot() {
            if (!gameActive) return;

            // Get direction from the center of the screen (crosshair) using the camera's view
            const shootRaycaster = new THREE.Raycaster();
            shootRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera); 
            const direction = shootRaycaster.ray.direction.clone();
            
            // Bullet visual setup
            const bulletGeometry = new THREE.SphereGeometry(0.15, 8, 8);
            const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
            
            // Spawn bullet from the player's position, aligned with the shot direction
            const spawnHeight = player.position.y + 1.2; 
            bullet.position.copy(player.position).add(direction.clone().multiplyScalar(1));
            bullet.position.y = spawnHeight;

            scene.add(bullet);

            activeBullets.push({
                mesh: bullet,
                direction: direction.normalize(), 
                life: 300 
            });
        }

        function handleBullets(delta) {
            for (let i = activeBullets.length - 1; i >= 0; i--) {
                const bulletData = activeBullets[i];
                
                // Move the bullet
                bulletData.mesh.position.addScaledVector(bulletData.direction, bulletSpeed * delta * 60);
                
                bulletData.life--;

                if (bulletData.life <= 0) {
                    scene.remove(bulletData.mesh);
                    activeBullets.splice(i, 1);
                }
            }
        }


        // --- Game Logic Functions ---
        function handlePlayerMovement(delta) {
            const distance = playerSpeed * delta * 60; 

            // Get player's forward direction based on rotation
            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyQuaternion(player.quaternion);
            forward.y = 0; 
            forward.normalize();
            
            // Get player's right direction (for strafing)
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            // W - Move Forward
            if (keyState['w']) {
                player.position.addScaledVector(forward, distance);
            }
            // S - Move Backward
            if (keyState['s']) {
                player.position.addScaledVector(forward, -distance);
            }
            // A - Strafe Left
            if (keyState['a']) {
                player.position.addScaledVector(right, -distance);
            }
            // D - Strafe Right (Fixed movement controls)
            if (keyState['d']) {
                player.position.addScaledVector(right, distance);
            }

            const maxBound = 145; 
            player.position.x = Math.max(-maxBound, Math.min(maxBound, player.position.x));
            player.position.z = Math.max(-maxBound, Math.min(maxBound, player.position.z));
        }

        function handleZoneLogic() {
            zoneRadius -= zoneShrinkRate * clock.getDelta();
            zoneRadius = Math.max(10, zoneRadius); 

            const playerDistance = player.position.distanceTo(zoneCenter);
            
            if (playerDistance > zoneRadius) {
                playerHealth = Math.max(0, playerHealth - damagePerTick * clock.getDelta() * 10);
                updateHealthUI();

                renderer.domElement.style.border = '2px solid red';
                setTimeout(() => renderer.domElement.style.border = 'none', 100);
            }

            updateZoneUI();

            if (playerHealth <= 0) {
                alert("You were eliminated by the storm! Refresh to restart.");
                cancelAnimationFrame(animate); 
            }
        }


        // --- UI Update Functions ---
        function updateInventoryUI() {
            const slots = document.querySelectorAll('.slot');
            slots.forEach((slot, index) => {
                const item = inventory[index];
                slot.textContent = `${index + 1}. ${item.name}`;
                slot.style.color = getRarityColor(item.rarity);
                
                if (index === activeSlot) {
                    slot.classList.add('active');
                } else {
                    slot.classList.remove('active');
                }
            });
        }

        function updateHealthUI() {
            document.getElementById('health-value').textContent = Math.round(playerHealth);
        }

        function updateZoneUI() {
            document.getElementById('zone-size').textContent = Math.round(zoneRadius);
        }

        function getRarityColor(rarity) {
            switch(rarity) {
                case 'Common': return '#aaaaaa'; 
                case 'Uncommon': return '#00aa00'; 
                case 'Rare': return '#0000aa'; 
                case 'Epic': return '#aa00aa'; 
                case 'Legendary': return '#ff8000'; 
                default: return 'white';
            }
        }

        // --- Helper and Event Handlers ---
        function createMapFeature(position, size, color) {
            const geometry = new THREE.BoxGeometry(size.x, size.y, size.z);
            const material = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(position.x, position.y / 2, position.z); 
            scene.add(mesh);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onKeyDown(event) {
            keyState[event.key.toLowerCase()] = true; 
            
            const slotKey = parseInt(event.key);
            if (slotKey >= 1 && slotKey <= 5) {
                activeSlot = slotKey - 1;
                updateInventoryUI();
            }
        }

        function onKeyUp(event) {
            keyState[event.key.toLowerCase()] = false;
        }

        // FIX: Handles Camera Yaw (player rotation) and Pitch (cameraPitch rotation)
        function onMouseMove(event) {
            if (document.pointerLockElement === renderer.domElement) {
                const movementX = event.movementX || 0;
                const movementY = event.movementY || 0;

                // 1. Yaw (Left/Right) - Rotates the entire player model
                player.rotation.y -= movementX * 0.002;
                
                // 2. Pitch (Up/Down) - Rotates the cameraPitch object
                cameraPitch.rotation.x -= movementY * 0.002;
                
                // Limit pitch rotation (to prevent flipping over)
                const maxPitch = Math.PI / 4; // 45 degrees
                cameraPitch.rotation.x = Math.max(-maxPitch, Math.min(maxPitch, cameraPitch.rotation.x));
            }
        }

        // Start the game!
        window.onload = init;
    </script>
</body>
</html>
