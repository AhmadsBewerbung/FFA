<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fortnite Web Clone</title> 
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; user-select: none; }
        canvas { display: block; }
        
        /* --- LOBBY SCREEN --- */
        #lobby-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2b4570 0%, #000000 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 100;
        }
        h1 { font-size: 5em; margin: 0; color: #f9d83e; text-shadow: 4px 4px 0px #000; font-style: italic; transform: skewY(-3deg); }
        p { font-size: 1.5em; margin-bottom: 40px; color: #ddd; }
        #play-button {
            padding: 20px 80px; font-size: 2em; cursor: pointer;
            background: #f9d83e; border: none; transform: skewX(-10deg);
            color: black; font-weight: 900; box-shadow: 5px 5px 0px white;
            transition: transform 0.1s;
        }
        #play-button:active { transform: skewX(-10deg) translate(2px, 2px); box-shadow: 2px 2px 0px white; }

        /* --- IN-GAME UI --- */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid black; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        
        #health-container {
            position: absolute; bottom: 30px; left: 30px;
            width: 300px; height: 20px; background: #333;
            border: 3px solid black; transform: skewX(-10deg);
        }
        #health-bar {
            width: 100%; height: 100%; background: #58ea28;
            transition: width 0.2s;
        }
        
        #storm-timer {
            position: absolute; top: 20px; right: 20px;
            font-family: monospace; font-size: 24px; font-weight: bold;
            color: #d85ef6; background: rgba(0,0,0,0.5); padding: 10px;
            border: 2px solid #d85ef6;
        }

        #inventory {
            position: absolute; bottom: 30px; right: 30px;
            display: flex; gap: 10px;
        }
        .slot {
            width: 60px; height: 60px; background: rgba(0,0,0,0.6);
            border: 3px solid #555; color: white; display: flex;
            justify-content: center; align-items: center; font-weight: bold;
            font-family: sans-serif; position: relative;
        }
        .slot span { font-size: 10px; position: absolute; top: 2px; left: 4px; color: #aaa; }
        .slot.active { border-color: #f9d83e; background: rgba(249, 216, 62, 0.2); transform: scale(1.1); }
        
        #controls-hint {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.5); font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="lobby-screen">
        <h1>FORTNITE CLONE</h1>
        <p>Build, Shoot, Survive the Storm</p>
        <button id="play-button">BATTLE BUS</button>
    </div>

    <div id="crosshair"></div>
    <div id="game-ui">
        <div id="controls-hint">
            WASD: Move<br>SPACE: Jump<br>CLICK: Shoot<br>Q: Build Wall<br>1-5: Inventory
        </div>
        <div id="storm-timer">STORM: <span id="zone-dist">100</span>m</div>
        <div id="health-container"><div id="health-bar"></div></div>
        
        <div id="inventory">
            <div class="slot active" id="slot1"><span>1</span>AR</div>
            <div class="slot" id="slot2"><span>2</span>Shotgun</div>
            <div class="slot" id="slot3"><span>3</span>Pickaxe</div>
            <div class="slot" id="slot4"><span>4</span>Meds</div>
            <div class="slot" id="slot5"><span>5</span>Sniper</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- CONFIGURATION ---
        const MOVEMENT_SPEED = 0.5;
        const JUMP_FORCE = 0.8;
        const GRAVITY = 0.04;
        const MOUSE_SENSITIVITY = 0.002;
        
        // --- GLOBALS ---
        let scene, camera, renderer;
        let player, cameraPivot;
        let gameActive = false;
        let health = 100;
        let zoneRadius = 150;
        let velocityY = 0;
        let onGround = false;
        
        // Arrays
        let bullets = [];
        let walls = [];
        let environment = [];

        // Input
        const keys = {};
        let activeSlot = 1;

        // Storm Visual
        let stormWall;

        function init() {
            // Setup Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Listeners
            document.getElementById('play-button').addEventListener('click', startGame);
            window.addEventListener('resize', onResize);
            document.addEventListener('keydown', (e) => keys[e.code] = true);
            document.addEventListener('keyup', (e) => keys[e.code] = false);
            document.addEventListener('mousedown', onClick);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('keydown', onKeyDownSpecial); // For switching slots/building

            animate();
        }

        function startGame() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            
            // Pointer Lock is ESSENTIAL for shooters
            document.body.requestPointerLock();
            
            setupScene();
            gameActive = true;
        }

        function setupScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky Blue
            scene.fog = new THREE.Fog(0x87CEEB, 20, 200);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Player Group
            player = new THREE.Group();
            createPlayerModel();
            scene.add(player);
            player.position.set(0, 5, 0);

            // Camera Pivot (For 3rd Person)
            cameraPivot = new THREE.Object3D();
            cameraPivot.position.y = 2.5; // Eye level
            player.add(cameraPivot);
            
            // Camera Offset
            cameraPivot.add(camera);
            camera.position.set(2, 0.5, 4); // Shoulder view
            camera.lookAt(cameraPivot.position);

            // Lighting
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            sun.shadow.camera.left = -100;
            sun.shadow.camera.right = 100;
            sun.shadow.camera.top = 100;
            sun.shadow.camera.bottom = -100;
            scene.add(sun);
            
            const ambient = new THREE.AmbientLight(0x404040, 0.8);
            scene.add(ambient);

            // Ground
            const planeGeo = new THREE.PlaneGeometry(400, 400);
            const planeMat = new THREE.MeshStandardMaterial({ color: 0x4C9A2A }); // Grass Green
            const ground = new THREE.Mesh(planeGeo, planeMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Map Objects (Trees/Rocks)
            for(let i=0; i<20; i++) {
                createTree(Math.random() * 200 - 100, Math.random() * 200 - 100);
            }
            
            // The Storm
            const stormGeo = new THREE.CylinderGeometry(zoneRadius, zoneRadius, 100, 32, 1, true);
            const stormMat = new THREE.MeshBasicMaterial({ color: 0xA020F0, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
            stormWall = new THREE.Mesh(stormGeo, stormMat);
            stormWall.position.y = 50;
            scene.add(stormWall);
        }

        function createPlayerModel() {
            const mat = new THREE.MeshStandardMaterial({ color: 0x3366cc });
            const skin = new THREE.MeshStandardMaterial({ color: 0xffccaa });

            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.6), mat);
            body.position.y = 2.25;
            body.castShadow = true;
            player.add(body);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), skin);
            head.position.y = 3.3;
            head.castShadow = true;
            player.add(head);
        }

        function createTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3), new THREE.MeshStandardMaterial({color: 0x5c4033}));
            trunk.position.set(x, 1.5, z);
            trunk.castShadow = true;
            scene.add(trunk);
            environment.push(trunk);

            const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 6, 8), new THREE.MeshStandardMaterial({color: 0x228b22}));
            leaves.position.set(x, 5, z);
            leaves.castShadow = true;
            scene.add(leaves);
        }

        function onMouseMove(e) {
            if(!gameActive) return;
            // Horizontal rotation (Player)
            player.rotation.y -= e.movementX * MOUSE_SENSITIVITY;
            
            // Vertical rotation (Camera Pivot)
            cameraPivot.rotation.x -= e.movementY * MOUSE_SENSITIVITY;
            // Clamp Look Up/Down
            cameraPivot.rotation.x = Math.max(-1.2, Math.min(1.2, cameraPivot.rotation.x));
        }

        function onKeyDownSpecial(e) {
            // Inventory Switching
            if(e.key >= 1 && e.key <= 5) {
                document.querySelectorAll('.slot').forEach(el => el.classList.remove('active'));
                document.getElementById('slot'+e.key).classList.add('active');
                activeSlot = parseInt(e.key);
            }
            // Building
            if(e.code === 'KeyQ') {
                buildWall();
            }
        }

        function onClick() {
            if(!gameActive) {
                document.body.requestPointerLock();
                return;
            }
            shoot();
        }

        function buildWall() {
            // Snap to grid
            const gridSize = 5;
            // Calculate position in front of player
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
            const buildPos = player.position.clone().add(forward.multiplyScalar(5));
            
            // Snap coords
            const snapX = Math.round(buildPos.x / gridSize) * gridSize;
            const snapZ = Math.round(buildPos.z / gridSize) * gridSize;
            
            const wallGeo = new THREE.BoxGeometry(5, 5, 0.5);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, map: null }); // Wood color
            const wall = new THREE.Mesh(wallGeo, wallMat);
            
            wall.position.set(snapX, 2.5, snapZ);
            wall.rotation.y = player.rotation.y; // Roughly face player
            
            // Snap rotation to 90 degrees
            const rotY = Math.round(wall.rotation.y / (Math.PI/2)) * (Math.PI/2);
            wall.rotation.y = rotY;

            scene.add(wall);
            walls.push(wall);
        }

        function shoot() {
            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            // Start at player position
            bullet.position.copy(player.position);
            bullet.position.y += 2.5; // Gun height

            // Calculate direction: Raycast from camera center
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            // Get direction from player to the raycasted point (aim point)
            const aimDir = raycaster.ray.direction.clone();
            
            bullet.userData = { velocity: aimDir.multiplyScalar(2), life: 100 };
            scene.add(bullet);
            bullets.push(bullet);
        }

        function updatePhysics() {
            // Gravity
            velocityY -= GRAVITY;
            player.position.y += velocityY;

            // Ground Collision
            if(player.position.y <= 0) {
                player.position.y = 0;
                velocityY = 0;
                onGround = true;
            } else {
                onGround = false;
            }

            // Movement
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
            
            if(keys['KeyW']) player.position.add(forward.clone().multiplyScalar(MOVEMENT_SPEED));
            if(keys['KeyS']) player.position.add(forward.clone().multiplyScalar(-MOVEMENT_SPEED));
            if(keys['KeyA']) player.position.add(right.clone().multiplyScalar(-MOVEMENT_SPEED));
            if(keys['KeyD']) player.position.add(right.clone().multiplyScalar(MOVEMENT_SPEED));
            
            // Jump
            if(keys['Space'] && onGround) {
                velocityY = JUMP_FORCE;
            }
        }

        function updateGameLogic() {
            // Shrink Zone
            if(zoneRadius > 0) {
                zoneRadius -= 0.05;
                stormWall.scale.set(zoneRadius/150, 1, zoneRadius/150); // Scale initial visual
                document.getElementById('zone-dist').innerText = Math.floor(zoneRadius);
            }

            // Check Zone Damage
            const dist = Math.sqrt(player.position.x**2 + player.position.z**2);
            if(dist > zoneRadius) {
                health -= 0.1;
                document.getElementById('health-bar').style.width = health + '%';
                if(health <= 0) {
                    alert("Eliminated by Storm!");
                    location.reload();
                }
            }

            // Update Bullets
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.position.add(b.userData.velocity);
                b.userData.life--;
                
                // Simple collision check with ground or walls could go here
                
                if(b.userData.life <= 0) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if(gameActive) {
                updatePhysics();
                updateGameLogic();
                renderer.render(scene, camera);
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Initial init
        window.onload = init;

    </script>
</body>
</html>
