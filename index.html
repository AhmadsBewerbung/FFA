<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fortnite Web Engine V2</title> 
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; user-select: none; }
        
        /* UI OVERLAY */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
            text-shadow: 2px 2px 0 #000;
        }

        /* CROSSHAIR */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px;
            background: white; border: 2px solid rgba(0,0,0,0.5);
            border-radius: 50%; transform: translate(-50%, -50%);
        }

        /* STATS */
        #stats-bar {
            position: absolute; bottom: 30px; left: 30px;
            color: white; font-size: 20px; font-weight: bold;
            display: flex; gap: 20px;
        }
        .stat-box { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 5px; border-left: 5px solid; }
        #health-box { border-color: #4cd137; }
        #ammo-box { border-color: #fbc531; }

        /* BUILD CONTROLS VISUAL */
        #build-menu {
            position: absolute; bottom: 120px; right: 30px;
            display: flex; flex-direction: column; gap: 5px;
            text-align: right; color: white; font-size: 14px; opacity: 0.8;
        }
        .key-hint { background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 4px; }
        .active-build { color: #00a8ff; border: 1px solid #00a8ff; }

        /* MESSAGES */
        #message-area {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            color: #e84118; font-weight: bold; font-size: 24px; display: none;
        }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #1e3799, #0c2461);
            display: flex; justify-content: center; align-items: center;
            pointer-events: all; z-index: 999;
        }
        #start-btn {
            padding: 20px 50px; font-size: 24px; font-weight: bold;
            background: #fbc531; border: none; cursor: pointer;
            box-shadow: 0 5px 0 #c29726; transition: 0.1s;
        }
        #start-btn:active { transform: translateY(5px); box-shadow: none; }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">CLICK TO PLAY</button>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="message-area">RELOADING...</div>
        
        <div id="build-menu">
            <div class="key-hint" id="hint-y">[Y] Wall</div>
            <div class="key-hint" id="hint-x">[X] Floor</div>
            <div class="key-hint" id="hint-c">[C] Stairs</div>
            <div class="key-hint" id="hint-v">[V] Cone</div>
            <div class="key-hint" id="hint-r">[R] Reload</div>
        </div>

        <div id="stats-bar">
            <div class="stat-box" id="health-box">HP: 100</div>
            <div class="stat-box" id="ammo-box">AMMO: 30</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- CONSTANTS ---
        const GRID_SIZE = 5;
        const WALK_SPEED = 0.4;
        const SPRINT_SPEED = 0.8;
        const JUMP_FORCE = 0.7;
        const GRAVITY = 0.03;
        
        // --- VARIABLES ---
        let scene, camera, renderer;
        let player, cameraPivot;
        let ground;
        
        // Physics
        let velocityY = 0;
        let onGround = false;
        let canJump = true;
        
        // State
        let isSprint = false;
        let isADS = false; // Aiming Down Sights
        let isReloading = false;
        let ammo = 30;
        
        // Input
        const keys = {};
        
        // Building System
        let buildMode = false;
        let currentBuildType = 'none'; // 'wall', 'floor', 'stair', 'cone'
        let previewMesh = null;
        let previewMaterial;
        const objects = []; // For collision/storage

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 150);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Player Setup
            createPlayer();
            createEnvironment();
            setupBuildingSystem();

            // Event Listeners
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);
            
            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-screen').style.display = 'none';
                document.body.requestPointerLock();
            });

            // Start Loop
            animate();
        }

        function createPlayer() {
            player = new THREE.Group();
            scene.add(player);
            player.position.set(0, 5, 0);

            // Simple Body Visual
            const bodyGeo = new THREE.BoxGeometry(1, 1.8, 0.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
            const mesh = new THREE.Mesh(bodyGeo, bodyMat);
            mesh.position.y = 0.9;
            mesh.castShadow = true;
            player.add(mesh);

            // Camera Pivot (Head)
            cameraPivot = new THREE.Object3D();
            cameraPivot.position.set(0, 1.7, 0);
            player.add(cameraPivot);
            
            // Attach Camera to Pivot
            cameraPivot.add(camera);
            camera.position.set(1.5, 0.5, 3.5); // Normal 3rd Person View
            camera.lookAt(cameraPivot.position.clone().add(new THREE.Vector3(0,0,-10)));
        }

        function createEnvironment() {
            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            sun.shadow.camera.left = -50;
            sun.shadow.camera.right = 50;
            sun.shadow.camera.top = 50;
            sun.shadow.camera.bottom = -50;
            scene.add(sun);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x44bd32 });
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2; // Flat ground
            ground.receiveShadow = true;
            scene.add(ground);
            objects.push(ground);

            // Random Trees
            const treeGeo = new THREE.ConeGeometry(2, 8, 8);
            const treeMat = new THREE.MeshStandardMaterial({ color: 0x009432 });
            for(let i=0; i<30; i++) {
                const tree = new THREE.Mesh(treeGeo, treeMat);
                tree.position.set(
                    (Math.random() - 0.5) * 200,
                    4,
                    (Math.random() - 0.5) * 200
                );
                tree.castShadow = true;
                scene.add(tree);
                objects.push(tree);
            }
        }

        function setupBuildingSystem() {
            // Transparent Blue Material for Preview
            previewMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00a8ff, 
                transparent: true, 
                opacity: 0.5,
                wireframe: false
            });
            
            // Placeholder mesh, geometry changes dynamically
            previewMesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), previewMaterial);
            previewMesh.visible = false;
            scene.add(previewMesh);
        }

        // --- CONTROLS & INPUT ---

        function onKeyDown(e) {
            keys[e.code] = true;

            // Sprint
            if(e.code === 'CapsLock') isSprint = !isSprint; // Toggle

            // Reload
            if(e.code === 'KeyR') reload();

            // Building Toggles
            if(e.code === 'KeyY') setBuildMode('wall');
            if(e.code === 'KeyX') setBuildMode('floor');
            if(e.code === 'KeyC') setBuildMode('stair');
            if(e.code === 'KeyV') setBuildMode('cone');
        }

        function onKeyUp(e) {
            keys[e.code] = false;
        }

        function onMouseDown(e) {
            if (document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
                return;
            }

            if(e.button === 0) { // Left Click
                if(buildMode && currentBuildType !== 'none') {
                    placeBuild();
                } else {
                    fireWeapon();
                }
            }
            if(e.button === 2) { // Right Click
                isADS = true;
            }
        }

        function onMouseUp(e) {
            if(e.button === 2) isADS = false;
        }

        function onMouseMove(e) {
            if (document.pointerLockElement === document.body) {
                // Rotate Player Body (Left/Right)
                player.rotation.y -= e.movementX * 0.002;
                
                // Rotate Camera Pivot (Up/Down)
                cameraPivot.rotation.x -= e.movementY * 0.002;
                cameraPivot.rotation.x = Math.max(-1.4, Math.min(1.4, cameraPivot.rotation.x));
            }
        }

        // --- GAME LOGIC ---

        function setBuildMode(type) {
            // If pressing same key, toggle off
            if(currentBuildType === type) {
                buildMode = false;
                currentBuildType = 'none';
                previewMesh.visible = false;
                updateUIHints();
                return;
            }

            buildMode = true;
            currentBuildType = type;
            previewMesh.visible = true;
            updateUIHints();

            // Update Preview Geometry based on type
            previewMesh.rotation.set(0,0,0); // Reset rotation
            if(type === 'wall') previewMesh.geometry = new THREE.BoxGeometry(GRID_SIZE, GRID_SIZE, 0.2);
            if(type === 'floor') previewMesh.geometry = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE);
            if(type === 'cone') previewMesh.geometry = new THREE.ConeGeometry(GRID_SIZE/1.5, GRID_SIZE/1.5, 4);
            if(type === 'stair') {
                previewMesh.geometry = new THREE.BoxGeometry(GRID_SIZE, 0.2, GRID_SIZE * 1.4);
            }
        }

        function updatePreview() {
            if(!buildMode || !previewMesh.visible) return;

            // Get position in front of player
            const playerDir = new THREE.Vector3();
            player.getWorldDirection(playerDir);
            
            const targetPos = player.position.clone().add(playerDir.multiplyScalar(GRID_SIZE));
            
            // Snap to Grid
            const snapX = Math.round(targetPos.x / GRID_SIZE) * GRID_SIZE;
            const snapZ = Math.round(targetPos.z / GRID_SIZE) * GRID_SIZE;
            const snapY = Math.round(player.position.y / GRID_SIZE) * GRID_SIZE; // Simplified vertical snapping

            // Apply specific logic per type
            if(currentBuildType === 'wall') {
                previewMesh.position.set(snapX, snapY + GRID_SIZE/2, snapZ);
                // Rotate based on player facing direction (0, 90, 180, 270)
                const rotY = Math.round(player.rotation.y / (Math.PI/2)) * (Math.PI/2);
                previewMesh.rotation.set(0, rotY, 0);
            } 
            else if(currentBuildType === 'floor') {
                previewMesh.position.set(snapX, snapY + 0.1, snapZ); // Slightly above grid line
                previewMesh.rotation.x = -Math.PI / 2;
            }
            else if(currentBuildType === 'cone') {
                previewMesh.position.set(snapX, snapY + GRID_SIZE/4, snapZ);
                previewMesh.rotation.y = Math.PI / 4; // Align square base
            }
            else if(currentBuildType === 'stair') {
                previewMesh.position.set(snapX, snapY + GRID_SIZE/2, snapZ);
                const rotY = Math.round(player.rotation.y / (Math.PI/2)) * (Math.PI/2);
                previewMesh.rotation.set(-Math.PI/4, rotY, 0); // 45 degree slope
            }
        }

        function placeBuild() {
            // Clone the preview mesh to create real object
            const realMat = new THREE.MeshStandardMaterial({ 
                color: 0xe67e22, // Wood color
                map: null 
            });
            const realBuild = new THREE.Mesh(previewMesh.geometry.clone(), realMat);
            
            realBuild.position.copy(previewMesh.position);
            realBuild.rotation.copy(previewMesh.rotation);
            realBuild.castShadow = true;
            realBuild.receiveShadow = true;
            
            scene.add(realBuild);
            objects.push(realBuild); // Add to physics collision list
        }

        function fireWeapon() {
            if(isReloading || ammo <= 0) return;
            
            ammo--;
            document.getElementById('ammo-box').innerText = `AMMO: ${ammo}`;
            
            // Recoil
            cameraPivot.rotation.x += 0.05;

            // Create Bullet Trace
            const bulletGeo = new THREE.SphereGeometry(0.1, 4, 4);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            // Start at gun position (approx right side of player)
            const right = new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
            bullet.position.copy(player.position).add(new THREE.Vector3(0, 1.5, 0)).add(right.multiplyScalar(0.5));
            
            // Shoot forward relative to camera
            const aimDir = new THREE.Vector3();
            camera.getWorldDirection(aimDir);
            
            scene.add(bullet);

            // Animate Bullet
            const speed = 2;
            const animateBullet = () => {
                bullet.position.add(aimDir.clone().multiplyScalar(speed));
                if(bullet.position.distanceTo(player.position) > 100) {
                    scene.remove(bullet);
                } else {
                    requestAnimationFrame(animateBullet);
                }
            };
            animateBullet();
        }

        function reload() {
            if(isReloading) return;
            isReloading = true;
            document.getElementById('message-area').style.display = 'block';
            setTimeout(() => {
                ammo = 30;
                document.getElementById('ammo-box').innerText = `AMMO: ${ammo}`;
                isReloading = false;
                document.getElementById('message-area').style.display = 'none';
            }, 2000); // 2 second reload
        }

        function updatePhysics() {
            // Movement
            const speed = isSprint ? SPRINT_SPEED : WALK_SPEED;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);

            if(keys['KeyW']) player.position.add(forward.clone().multiplyScalar(speed));
            if(keys['KeyS']) player.position.add(forward.clone().multiplyScalar(-speed));
            if(keys['KeyA']) player.position.add(right.clone().multiplyScalar(-speed));
            if(keys['KeyD']) player.position.add(right.clone().multiplyScalar(speed));

            // Gravity
            velocityY -= GRAVITY;
            player.position.y += velocityY;

            // Ground check (Simple floor check)
            if(player.position.y <= 0) {
                player.position.y = 0;
                velocityY = 0;
                onGround = true;
                canJump = true;
            } else {
                onGround = false;
            }

            // Jump (No Spam Logic)
            if(keys['Space'] && onGround && canJump) {
                velocityY = JUMP_FORCE;
                canJump = false; // Prevent holding space to bounce
            }
            if(!keys['Space'] && onGround) {
                canJump = true; // Reset when key released
            }
        }

        function updateCamera() {
            // ADS Logic (Lerp aiming)
            const targetFOV = isADS ? 40 : 75;
            const targetX = isADS ? 0.8 : 1.5;
            const targetZ = isADS ? 1.5 : 3.5;

            camera.fov += (targetFOV - camera.fov) * 0.2;
            camera.updateProjectionMatrix();
            
            camera.position.x += (targetX - camera.position.x) * 0.2;
            camera.position.z += (targetZ - camera.position.z) * 0.2;
        }

        function updateUIHints() {
            // clear highlights
            document.querySelectorAll('.key-hint').forEach(el => el.classList.remove('active-build'));
            
            if(currentBuildType === 'wall') document.getElementById('hint-y').classList.add('active-build');
            if(currentBuildType === 'floor') document.getElementById('hint-x').classList.add('active-build');
            if(currentBuildType === 'stair') document.getElementById('hint-c').classList.add('active-build');
            if(currentBuildType === 'cone') document.getElementById('hint-v').classList.add('active-build');
        }

        function animate() {
            requestAnimationFrame(animate);
            
            updatePhysics();
            updatePreview();
            updateCamera();
            
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        window.onload = init;
    </script>
</body>
</html>
